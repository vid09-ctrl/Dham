{% extends "base.html" %}
{% block content %}

<div class="page-wrapper">
<div class="container mt-4">

  <h3 class="text-success mb-4">Edit Donation Box Payment</h3>
  <hr>

  <form method="POST">
    {% csrf_token %}
    
    <div class="row">
      <!-- LEFT COLUMN -->
      <div class="col-md-6">
        <!-- Donation Box (VIEW ONLY) -->
        <div class="mb-3">
          <label class="form-label">Donation Box</label>
          <input type="text" class="form-control"
                 value="{{ payment.donation_box.donation_box_name }} (ID: {{ payment.donation_box.donation_id }})"
                 readonly>
        </div>

        <!-- Address (EDITABLE) -->
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" name="address" class="form-control"
                 value="{{ payment.address }}" required>
        </div>

        <!-- Received By (VIEW ONLY) -->
        <div class="mb-3">
          <label class="form-label">Received By</label>
          <select class="form-select" disabled>
              <option selected>
                  {{ payment.received_by.first_name }} {{ payment.received_by.last_name }}
              </option>
          </select>
          <input type="hidden" name="received_by" value="{{ payment.received_by.id }}">
        </div>

        <!-- Payment Method (VIEW ONLY) -->
        <div class="mb-3">
          <label class="form-label">Payment Method</label>
          <select class="form-select" disabled>
              <option selected>{{ payment.payment_method.lookup_name }}</option>
          </select>
          <input type="hidden" name="payment_method" value="{{ payment.payment_method.id }}">
        </div>

        <!-- Witness (EDITABLE) -->
        <div class="mb-3">
          <label class="form-label">Witness</label>
          <input type="text" name="i_witness"
                 class="form-control"
                 value="{{ payment.i_witness }}">
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-md-6">
        <!-- Donation Box Owner (VIEW ONLY) -->
        <div class="mb-3">
          <label class="form-label">Donation Box Owner</label>
          <input type="text" class="form-control"
                 value="{{ payment.owner.first_name }} {{ payment.owner.last_name }}"
                 readonly>
        </div>

        <!-- Opened By (VIEW ONLY) -->
        <div class="mb-3">
          <label class="form-label">Opened By</label>
          <select class="form-select" disabled>
              <option selected>
                  {{ payment.opened_by.first_name }} {{ payment.opened_by.last_name }}
              </option>
          </select>
          <input type="hidden" name="opened_by" value="{{ payment.opened_by.id }}">
        </div>

        <!-- Amount (EDITABLE) -->
        <div class="mb-3">
          <label class="form-label">Amount</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" name="amount" step="0.01"
                   class="form-control"
                   value="{{ payment.amount }}" required>
          </div>
        </div>

        <!-- Date & Time (VIEW ONLY) -->
        <div class="mb-3">
          <label class="form-label">Date & Time</label>
          <input type="text" class="form-control" value="{{ payment.date_time|date:'Y-m-d H:i:s' }}" readonly>
        </div>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="d-flex justify-content-center mt-4 gap-3">
        <button type="submit" class="btn btn-success px-5">Save Changes</button>
        <a href="{% url 'welcome' %}?tab=Donation Module"
           class="btn btn-secondary px-5">Back</a>
    </div>

  </form>
</div>
</div>

{% endblock %}
